<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños, Mely</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <style>
        /* Ajustes exclusivos para la portada */
        .landing .flipbook-viewport {
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
        }
        .flipbook-viewport .turn-page {
            background: #fff;
            color: #3e0e0e;
            padding: 30px;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="landing">
    <div class="landing-container">
        <h1>¡Feliz Cumpleaños, Mely! 🎂</h1>
        <div class="flipbook-viewport">
            <div id="flipbook">
                <!-- Páginas del libro -->
                <div class="page" style="background:#fbe9e7;">
                    <h2>Para mi amor</h2>
                    <p>Hoy celebramos tu día, y quiero que este libro guarde nuestro primer recuerdo.</p>
                </div>
                <div class="page" style="background:#fff;">
                    <p>Eres la persona más especial del universo...</p>
                </div>
                <div class="page" style="background:#fbe9e7;">
                    <p>Y esto es solo el principio de nuestra historia juntos.</p>
                </div>
                <div class="page" style="background:#fff;">
                    <p>Te amo, Mely. ♥️</p>
                </div>
            </div>
        </div>
        <a href="login.html" class="btn-diary">Entrar a nuestro diario</a>
    </div>
    <script src="js/book.js"></script>
</body>
</html>
